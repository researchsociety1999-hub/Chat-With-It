name: Mobile layout P0 fix

on:
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply mobile composer + sidebar width patch
        run: |
          python3 << 'PY'
          from pathlib import Path

          path = Path('index.html')
          src = path.read_text()

          old_768 = """@media (max-width: 768px) {
            #composerWrap { position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000; background: var(--panel); padding: .75rem 1rem; padding-bottom: calc(.75rem + env(safe-area-inset-bottom,0px)); border-top: 1px solid var(--border); }
            .main { padding-bottom: 80px; }
            .btn, .menu-item, .persona-card, .chip, .confirm-btn { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
            .chat-body { padding-bottom: 80px; }
          }"""

          new_768 = """@media (max-width: 768px) {
            /* Keep composer in flex-column flow on phones — fixed + 80px padding was covering chat */
            #composerWrap {
              position: static;
              inset: auto;
              z-index: auto;
              width: auto;
              flex-shrink: 0;
              background: var(--panel);
              padding: .75rem 1rem;
              padding-bottom: calc(.75rem + env(safe-area-inset-bottom, 0px));
              border-top: 1px solid var(--border);
            }
            .main { padding-bottom: 0; }
            .btn, .menu-item, .persona-card, .chip, .confirm-btn { min-height: 44px; min-width: 44px; display: inline-flex; align-items: center; justify-content: center; }
            .chat-body { padding-bottom: 1rem; }
          }"""

          if old_768 not in src:
              raise SystemExit('768px media block not found — aborting')

          src = src.replace(old_768, new_768, 1)

          # Cap sidebar width on small phones (merge into existing 640px block)
          marker = "@media (max-width: 640px) {\n  .model-badge { max-width: 140px; }"
          insert = "@media (max-width: 640px) {\n  .sidebar { width: min(var(--sidebar-w), 88vw); }\n  .model-badge { max-width: 140px; }"

          if '.sidebar { width: min(var(--sidebar-w), 88vw); }' in src:
              print('sidebar width cap already present')
          elif marker not in src:
              raise SystemExit('640px media block marker not found — aborting')
          else:
              src = src.replace(marker, insert, 1)

          # Safety: do not break sidebar-open composer hide
          assert 'body.sidebar-open #composerWrap' in src
          assert 'id="composerWrap"' in src
          assert 'position: static' in src

          path.write_text(src)
          print('index.html patched OK', len(src), 'bytes')
          PY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo 'Nothing to commit' && exit 0
          git commit -m "fix(mobile): keep composer in flow; cap sidebar to 88vw on small phones"
          git push
