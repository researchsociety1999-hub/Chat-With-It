name: Patch app sidebar

on:
  push:
    paths:
      - .github/workflows/patch-app-sidebar.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove 140px bottom reserve
        run: |
          set -euo pipefail
          if grep -q 'bottom: 140px' css/app.css; then
            sed -i 's/bottom: 140px;/bottom: 0;/' css/app.css
            sed -i 's/max-height: calc(100dvh - 140px);/max-height: none;/' css/app.css
            echo patched
          else
            echo already_patched
          fi
          grep -n 'bottom: 0\|bottom: 140\|max-height: none\|max-height: calc' css/app.css | head -20
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/app.css
          git diff --staged --quiet && echo noop && exit 0
          git commit -m "fix(css): remove 140px mobile sidebar bottom reserve in app.css"
          git push
