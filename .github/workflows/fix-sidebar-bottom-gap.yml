name: Fix sidebar bottom gap

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-sidebar-bottom-gap.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch app.css, pwa-safe-area.css, sw.js
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          app = Path('css/app.css')
          text = app.read_text(encoding='utf-8')
          old = """  .sidebar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 140px;
    height: auto;
    max-height: calc(100dvh - 140px);
    width: var(--sidebar-w);
    z-index: 100;
    box-shadow: var(--shadow);
    overflow-y: auto;
    overflow-x: hidden;
  }"""
          new = """  .sidebar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    height: auto;
    max-height: none;
    width: var(--sidebar-w);
    z-index: 100;
    box-shadow: var(--shadow);
    overflow-y: auto;
    overflow-x: hidden;
  }"""
          if old not in text:
              if 'bottom: 140px' not in text:
                  print('app.css: 140px already gone')
              else:
                  raise SystemExit('app.css: expected sidebar block not found')
          else:
              app.write_text(text.replace(old, new, 1), encoding='utf-8')
              print('app.css: removed 140px bottom reserve')

          pwa = Path('css/pwa-safe-area.css')
          pwa.write_text('''/**
 * PWA home-screen / standalone layout containment
 * + mobile drawer full-height fix (composer is hidden while sidebar is open).
 */

html {
  width: 100%;
  max-width: 100%;
  height: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
}

body {
  width: 100%;
  max-width: 100%;
  overflow: hidden;
  overflow-x: hidden;
  overscroll-behavior: none;
  min-height: 100vh;
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  height: 100vh;
  height: 100dvh;
  height: -webkit-fill-available;
}

.app {
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  height: 100%;
  max-height: 100%;
  min-height: 0;
  overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}

.sidebar {
  box-sizing: border-box;
}

/*
 * Mobile drawer: stretch top-to-bottom.
 * Composer is hidden when sidebar is open — do not reserve bottom space.
 * top+bottom + height:auto is more reliable than 100dvh alone on iOS PWA.
 */
@media (max-width: 1100px) {
  .sidebar,
  .sidebar.open {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: auto !important;
    bottom: 0 !important;
    height: auto !important;
    max-height: none !important;
    width: min(
      var(--sidebar-w),
      calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))
    ) !important;
    z-index: 110;
    padding-top: calc(1rem + env(safe-area-inset-top, 0px));
    padding-bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
    padding-left: calc(0.85rem + env(safe-area-inset-left, 0px));
    box-sizing: border-box;
    overflow-x: hidden;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  .mobile-overlay.show {
    z-index: 105;
  }
}

@media (max-width: 640px) {
  .sidebar,
  .sidebar.open {
    width: min(
      var(--sidebar-w),
      88%,
      calc(100% - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px))
    ) !important;
  }
}

@media (display-mode: standalone), (display-mode: fullscreen) {
  html,
  body {
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    overflow-x: hidden;
    height: 100%;
    height: -webkit-fill-available;
  }

  .app {
    width: 100%;
    max-width: 100%;
    height: 100%;
    max-height: -webkit-fill-available;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }

  .main,
  .main-wrapper,
  .chat-body {
    min-width: 0;
    max-width: 100%;
  }

  #composerWrap {
    padding-bottom: calc(0.75rem + env(safe-area-inset-bottom, 0px));
    box-sizing: border-box;
  }

  .toast-area {
    right: calc(1rem + env(safe-area-inset-right, 0px));
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  }

  .chips,
  .welcome,
  .msg,
  .chat-header,
  .header-actions {
    max-width: 100%;
  }

  @media (max-width: 1100px) {
    .sidebar,
    .sidebar.open {
      top: 0 !important;
      bottom: 0 !important;
      height: auto !important;
      max-height: none !important;
    }
  }
}
''', encoding='utf-8')
          print('pwa-safe-area.css rewritten')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if 'chatwithit-v16' in sw_text:
              sw.write_text(sw_text.replace('chatwithit-v16', 'chatwithit-v17'), encoding='utf-8')
              print('sw.js v16 -> v17')
          elif 'chatwithit-v17' in sw_text:
              print('sw.js already v17')
          else:
              print('sw.js unexpected cache name')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/app.css css/pwa-safe-area.css sw.js
          if git diff --staged --quiet; then
            echo "No change"
            exit 0
          fi
          git commit -m "fix(ui): eliminate mobile sidebar bottom gap (remove 140px reserve)"
          git push
