name: Run polish gen toggle

on:
  push:
    paths:
      - scripts/polish-gen-toggle-css.py
      - .github/workflows/run-polish-gen-toggle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/polish-gen-toggle-css.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/app.css sw.js
          git diff --staged --quiet && echo noop && exit 0
          git commit -m "style(ui): polish generation toggle switch (hover, size, a11y)"
          git push
