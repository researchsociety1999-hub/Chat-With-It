name: Run gen toggle script

on:
  push:
    paths:
      - scripts/add-gen-controls-toggle.py
      - .github/workflows/run-gen-toggle-script.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run patch script
        run: python3 scripts/add-gen-controls-toggle.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html js/state.js js/app.js js/api.js css/app.css sw.js
          git diff --staged --quiet && echo noop && exit 0
          git commit -m "feat(ui): toggle to enable/disable temperature and max tokens"
          git push
