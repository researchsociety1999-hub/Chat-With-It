name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build
      - name: Check bundle size
        run: |
          SIZE=$(gzip -c dist/app.js | wc -c)
          echo "Gzipped size: ${SIZE} bytes"
          if [ "$SIZE" -gt 512000 ]; then exit 1; fi
      - run: test -f dist/app.js
