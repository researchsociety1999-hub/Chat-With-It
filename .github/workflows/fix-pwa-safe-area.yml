name: Fix PWA safe-area

"on":
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Append PWA standalone safe-area CSS + update sidebar media query
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("css/app.css")
          css = path.read_text(encoding="utf-8")

          # 1) Tighten body / .app height for iOS standalone (100dvh alone overflows)
          css = css.replace(
              "body { margin: 0; overflow: hidden; height: 100dvh; font-family: 'Satoshi', system-ui, sans-serif; background-color: var(--bg); color: var(--fg); }\n"
              ".app { display: grid; grid-template-columns: var(--sidebar-w) 1fr 0; height: 100dvh; overflow: hidden; }\n"
              ".sidebar { height: 100dvh; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: .75rem; padding: 1rem .85rem; background: var(--panel); border-right: 1px solid var(--border); flex-shrink: 0; scrollbar-width: thin; z-index: 100; }",
              """html {
  width: 100%;
  max-width: 100%;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  height: 100%;
}
body {
  margin: 0;
  overflow: hidden;
  overflow-x: hidden;
  width: 100%;
  max-width: 100%;
  overscroll-behavior: none;
  /* iOS standalone: 100dvh can exceed the visible frame */
  min-height: 100vh;
  min-height: 100dvh;
  min-height: -webkit-fill-available;
  height: 100vh;
  height: 100dvh;
  height: -webkit-fill-available;
  font-family: 'Satoshi', system-ui, sans-serif;
  background-color: var(--bg);
  color: var(--fg);
}
.app {
  display: grid;
  grid-template-columns: var(--sidebar-w) 1fr 0;
  width: 100%;
  max-width: 100%;
  box-sizing: border-box;
  height: 100%;
  max-height: 100%;
  min-height: 0;
  overflow: hidden;
  /* Notch / status bar / home indicator when installed to home screen */
  padding-top: env(safe-area-inset-top, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.sidebar {
  height: 100%;
  max-height: 100%;
  overflow-y: auto;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  gap: .75rem;
  padding: 1rem .85rem;
  padding-top: calc(1rem + env(safe-area-inset-top, 0px));
  background: var(--panel);
  border-right: 1px solid var(--border);
  flex-shrink: 0;
  scrollbar-width: thin;
  z-index: 100;
  box-sizing: border-box;
}""",
          )

          # 2) Mobile overlay sidebar must respect safe areas
          old_side = """  .sidebar {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    bottom: 140px;
    height: auto;
    max-height: calc(100dvh - 140px);
    width: var(--sidebar-w);
    z-index: 100;
    box-shadow: var(--shadow);
    overflow-y: auto;
    overflow-x: hidden;
  }"""
          new_side = """  .sidebar {
    display: none;
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    left: env(safe-area-inset-left, 0px);
    bottom: max(140px, calc(120px + env(safe-area-inset-bottom, 0px)));
    height: auto;
    max-height: calc(100dvh - 140px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    width: min(var(--sidebar-w), calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
    z-index: 100;
    box-shadow: var(--shadow);
    overflow-y: auto;
    overflow-x: hidden;
    padding-top: 1rem;
  }"""
          if old_side in css:
              css = css.replace(old_side, new_side)
          else:
              print("WARN: mobile sidebar block not found exactly")

          # 3) Append display-mode: standalone reinforcements (idempotent)
          marker = "/* PWA standalone safe-area (home screen) */"
          block = f"""
{marker}
@media (display-mode: standalone), (display-mode: fullscreen) {
  html, body {{
    width: 100%;
    max-width: 100%;
    overflow: hidden;
    overflow-x: hidden;
    overscroll-behavior: none;
    height: 100%;
    height: -webkit-fill-available;
  }}
  .app {{
    width: 100%;
    max-width: 100%;
    height: 100%;
    max-height: -webkit-fill-available;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }}
  .sidebar {{
    height: 100%;
    max-height: 100%;
  }}
  /* Avoid double top inset on desktop sidebar when .app already pads */
  @media (min-width: 1101px) {{
    .sidebar {{ padding-top: 1rem; }}
  }}
  #composerWrap {{
    padding-bottom: calc(.75rem + env(safe-area-inset-bottom, 0px));
  }}
  .toast-area {{
    right: calc(1rem + env(safe-area-inset-right, 0px));
    bottom: calc(1rem + env(safe-area-inset-bottom, 0px));
  }}
}}
"""
          if marker not in css:
              css = css.rstrip() + "\n" + block
          else:
              print("standalone block already present")

          path.write_text(css, encoding="utf-8")
          print("css/app.css patched, bytes:", path.stat().st_size)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/app.css
          if git diff --staged --quiet; then
            echo "No CSS changes"
            exit 0
          fi
          git commit -m "fix(pwa): safe-area insets + contain layout in standalone home-screen mode"
          git push
