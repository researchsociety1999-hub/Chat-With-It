name: Polish three

on:
  workflow_dispatch:

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract CSS + file-attach UI + package + README
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re, json

          # ── 1. Extract inline <style> → css/app.css ──────────────────────────
          index = Path('index.html')
          html = index.read_text()
          m = re.search(r'<style>\n(.*?)\n  </style>', html, re.S)
          if not m:
              raise SystemExit('Could not find inline <style> block')
          css = m.group(1)

          # Append file-attach styles
          css += '''

/* ── File attachments ─────────────────────────────────────────────────────── */
.attach-list {
  display: flex;
  flex-wrap: wrap;
  gap: .35rem;
  margin-top: .35rem;
}
.attach-chip {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  padding: .25rem .55rem;
  border-radius: 99px;
  border: 1px solid var(--border-2);
  background: var(--panel-2);
  font-size: .72rem;
  font-weight: 600;
  color: var(--fg-muted);
  max-width: 220px;
}
.attach-chip span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.attach-chip button {
  border: none;
  background: transparent;
  color: var(--fg-subtle);
  cursor: pointer;
  font-size: .8rem;
  line-height: 1;
  padding: 0;
}
.attach-chip button:hover { color: var(--danger); }
#attachBtn { flex-shrink: 0; }
'''
          Path('css').mkdir(exist_ok=True)
          Path('css/app.css').write_text(css)
          print('css/app.css written', len(css), 'bytes')

          # Replace style block with link to css/app.css (keep profiles.css)
          html = re.sub(
              r'<style>\n.*?\n  </style>',
              '<link rel="stylesheet" href="css/app.css">',
              html,
              count=1,
              flags=re.S,
          )

          # ── 2. Inject file attach UI into composer ───────────────────────────
          # Add attach button before send/stop group and attach list after composer-box
          if 'id="fileInput"' not in html:
              old_btns = '''            <div class="composer-btns">
              <button id="stopBtn" class="btn" type="button" aria-label="Stop generation">⏹ Stop</button>
              <button id="sendBtn" class="btn btn-primary" type="button" aria-label="Send message">Send ↑</button>
            </div>'''
              new_btns = '''            <div class="composer-btns">
              <input id="fileInput" type="file" class="hidden" accept=".txt,.md,.json,.csv,.py,.js,.ts,.tsx,.jsx,.html,.css,.xml,.yml,.yaml,.toml,.sh,.sql,.log" multiple aria-hidden="true">
              <button id="attachBtn" class="btn btn-ghost btn-icon" type="button" title="Attach text files" aria-label="Attach text files">📎</button>
              <button id="stopBtn" class="btn" type="button" aria-label="Stop generation">⏹ Stop</button>
              <button id="sendBtn" class="btn btn-primary" type="button" aria-label="Send message">Send ↑</button>
            </div>'''
              if old_btns not in html:
                  raise SystemExit('composer-btns block not found')
              html = html.replace(old_btns, new_btns, 1)

              old_wrap_end = '''        </div>
        <details class="privacy-panel"'''
              new_wrap_end = '''        </div>
        <div id="attachList" class="attach-list" aria-live="polite"></div>
        <details class="privacy-panel"'''
              if old_wrap_end not in html:
                  raise SystemExit('composer wrap end not found')
              html = html.replace(old_wrap_end, new_wrap_end, 1)

          index.write_text(html)
          print('index.html updated', len(html), 'bytes')

          # ── 3. package.json rename ───────────────────────────────────────────
          pkg_path = Path('package.json')
          pkg = json.loads(pkg_path.read_text())
          pkg['name'] = 'chatwithit'
          pkg['description'] = 'ChatWithIt — privacy-first browser-only multi-provider AI chat. No backend. Keys stay in memory.'
          pkg_path.write_text(json.dumps(pkg, indent=2) + '\n')
          print('package.json updated')

          # ── 4. Honest README (features match product) ────────────────────────
          readme = '''<div align="center">

# 💬 ChatWithIt

### The most private way to chat with frontier AI models.

**100+ free models. Zero backend. Your keys never leave your browser.**

[![Deploy with Vercel](https://vercel.com/button)](https://vercel.com/new/clone?repository-url=https://github.com/researchsociety1999-hub/Chat-With-It)
[![MIT License](https://img.shields.io/badge/license-MIT-blue.svg)](LICENSE)
[![No Backend](https://img.shields.io/badge/backend-none-brightgreen.svg)]()
[![Privacy First](https://img.shields.io/badge/tracking-none-red.svg)]()
[![PWA Ready](https://img.shields.io/badge/PWA-ready-purple.svg)]()

[**Live Demo →**](https://your-vercel-url.vercel.app) · [**View Source**](https://github.com/researchsociety1999-hub/Chat-With-It)

</div>

---

## Why ChatWithIt?

Most AI chat apps require you to trust their servers with your API keys and conversations.

ChatWithIt is different.

> **Your API key lives only in browser memory for this session. It is never written to localStorage, cookies, or any intermediate server — only sent directly to OpenRouter or Hugging Face over HTTPS.**

That is not a claim. [You can read the source.](./js/api.js)

---

## Start in 60 seconds

```bash
git clone https://github.com/researchsociety1999-hub/Chat-With-It.git
cd Chat-With-It
npm install
npm run build
npm start
# open http://localhost:3000
```

Or deploy the static site on Vercel (`npm run build` runs automatically via `vercel.json`).

**Setup**
1. Open the app
2. Choose OpenRouter or Hugging Face
3. Paste your API key (session memory only)
4. Pick a free model and chat

---

## Get an API key

| Provider | Link | Free tier |
|----------|------|-----------|
| OpenRouter | [openrouter.ai/keys](https://openrouter.ai/keys) | Free models + optional credits |
| Hugging Face | [huggingface.co/settings/tokens](https://huggingface.co/settings/tokens) | Free inference tier |

---

## Features (current)

### Chat
- OpenRouter + Hugging Face providers
- Free-model discovery (`:free` suffix and zero pricing)
- Streaming responses with stop control
- Personas: Assistant, Tutor, Creative Writer, Code Reviewer, Debate Coach
- Text file attachments (`.txt`, `.md`, `.json`, `.csv`, code files)
- Keyboard shortcuts (Enter send, Shift+Enter newline, Ctrl/Cmd+K model search, Escape closes menus)

### Session tools
- Live token / context usage
- Session stats panel
- Export Markdown / JSON / TXT / PDF / clipboard copy
- Optional local chat history (7-day TTL); API keys never persisted

### Customize
- Themes: Dark, Light, Violet, Ember, Forest, Aurora + system
- High-contrast mode
- Temperature and max-tokens controls
- Collapsible desktop sidebar; mobile drawer

### Deploy
- Static PWA (`manifest.json` + `sw.js`)
- esbuild bundle (`npm run build` → `dist/app.js`)
- Security headers via `vercel.json` (CSP, HSTS, frame denial)

---

## Trust signals

| Signal | Detail |
|---|---|
| No backend | Browser → provider only |
| Keys in memory | Cleared on idle timeout / lock / tab close; not stored |
| No tracking | No analytics cookies |
| CSP | Enforced in `vercel.json` |
| MIT | Fully open source |

---

## Architecture

```
ChatWithIt/
├── index.html          # Shell + DOM
├── css/
│   ├── app.css         # Main layout + themes (extracted from inline)
│   └── profiles.css    # API key profiles panel
├── js/
│   ├── app.js          # Controller
│   ├── api.js          # Providers + streaming
│   ├── ui.js           # DOM / toasts / sidebar
│   ├── state.js        # In-memory state + safe persistence
│   ├── profiles.js     # Key profiles
│   └── utils.js        # Helpers
├── dist/app.js         # Production bundle
├── sw.js / manifest.json
└── vercel.json
```

---

## Roadmap

- [ ] Image / drag-and-drop multimodal attach
- [ ] Encrypted local history passphrase
- [ ] Custom saved personas
- [ ] Side-by-side model compare
- [ ] Message search across history

---

## FAQ

**Is my API key safe?**
It stays in JavaScript memory for the session and is sent only to the chosen provider. It is not written to `localStorage`.

**Do you store conversations?**
Optionally in your browser only (7-day TTL). Export anytime. Nothing is sent to a ChatWithIt server — there is none.

**Can I self-host?**
Yes. Static files + `npm run build`.

---

## License

MIT — built by [Rishi](https://github.com/researchsociety1999-hub)
'''
          Path('README.md').write_text(readme)
          print('README.md updated')
          PY

      - name: Wire file attach in app.js
        run: |
          python3 << 'PY'
          from pathlib import Path

          path = Path('js/app.js')
          src = path.read_text()

          if 'setupAttachListeners' in src:
              print('setupAttachListeners already present')
          else:
              # Call from init after setupChatListeners
              needle = '      this.setupChatListeners();\n      this.setupUIListeners();'
              insert = '      this.setupChatListeners();\n      this.setupAttachListeners();\n      this.setupUIListeners();'
              if needle not in src:
                  raise SystemExit('init setup block not found')
              src = src.replace(needle, insert, 1)

              # Append methods before final export default App
              methods = r'''
  // ── File attachments (text only) ──────────────────────────────────────────

  static MAX_ATTACH_BYTES = 200 * 1024; // 200 KB per file
  static MAX_ATTACH_COUNT = 5;
  static ATTACH_EXTS = new Set([
    '.txt', '.md', '.json', '.csv', '.py', '.js', '.ts', '.tsx', '.jsx',
    '.html', '.css', '.xml', '.yml', '.yaml', '.toml', '.sh', '.sql', '.log',
  ]);

  setupAttachListeners() {
    const input = UI.el('fileInput');
    const btn = UI.el('attachBtn');
    if (!input || !btn) return;

    btn.addEventListener('click', () => input.click());
    input.addEventListener('change', async () => {
      const files = Array.from(input.files || []);
      input.value = '';
      for (const file of files) {
        await this._addAttachment(file);
      }
      this._renderAttachments();
    });
  },

  async _addAttachment(file) {
    if (!file) return;
    const name = file.name || 'file';
    const ext = name.includes('.') ? '.' + name.split('.').pop().toLowerCase() : '';
    if (!App.constructor.ATTACH_EXTS.has(ext)) {
      UI.toast(`Unsupported type: ${name}`, 'warning');
      return;
    }
    if (file.size > App.constructor.MAX_ATTACH_BYTES) {
      UI.toast(`${name} exceeds 200 KB limit`, 'warning');
      return;
    }
    if (AppState.attachedFiles.length >= App.constructor.MAX_ATTACH_COUNT) {
      UI.toast('Maximum 5 attachments', 'warning');
      return;
    }
    if (AppState.attachedFiles.some(f => f.name === name && f.size === file.size)) {
      return;
    }
    try {
      const text = await file.text();
      AppState.attachedFiles.push({
        name,
        size: file.size,
        type: file.type || 'text/plain',
        content: text,
      });
      UI.toast(`Attached ${name}`, 'success');
    } catch (err) {
      UI.toast(`Could not read ${name}`, 'error');
    }
  },

  _renderAttachments() {
    const list = UI.el('attachList');
    if (!list) return;
    list.innerHTML = '';
    AppState.attachedFiles.forEach((f, idx) => {
      const chip = document.createElement('div');
      chip.className = 'attach-chip';
      const label = document.createElement('span');
      label.textContent = f.name;
      label.title = `${f.name} (${Math.round(f.size / 1024)} KB)`;
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.setAttribute('aria-label', `Remove ${f.name}`);
      remove.textContent = '×';
      remove.addEventListener('click', () => {
        AppState.attachedFiles.splice(idx, 1);
        this._renderAttachments();
      });
      chip.appendChild(label);
      chip.appendChild(remove);
      list.appendChild(chip);
    });
  },

  _buildMessageWithAttachments(userText) {
    if (!AppState.attachedFiles.length) return userText;
    const blocks = AppState.attachedFiles.map(f => {
      const fence = f.name.endsWith('.md') ? 'markdown' : (f.name.split('.').pop() || 'text');
      return `📎 **${f.name}**\n\n\`\`\`${fence}\n${f.content}\n\`\`\``;
    });
    const body = userText ? userText + '\n\n' : '';
    return body + blocks.join('\n\n');
  },

'''
              # Use plain string not raw for insertion - the methods above used r''' wrongly for escapes
              # Re-do methods as normal string
              pass

          path.write_text(src)
          print('app.js init hook stage done')
          PY

          # Second python pass with correct method injection (avoid escape mess)
          python3 << 'PY'
          from pathlib import Path

          path = Path('js/app.js')
          src = path.read_text()

          if 'setupAttachListeners()' in src and '_buildMessageWithAttachments' in src:
