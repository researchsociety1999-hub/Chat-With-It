name: Polish three

"on":
  workflow_dispatch: {}

jobs:
  polish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run polish script
        run: |
          chmod +x scripts/polish-three.sh
          bash scripts/polish-three.sh
          python3 scripts/fix-attach-newlines.py
          npm run build

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status
          git diff --cached --stat
          git commit -m "feat: extract app.css, rename package to chatwithit, wire text file attachments" || echo "nothing to commit"
          git push
