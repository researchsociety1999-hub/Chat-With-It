      - name: npm install and build bundle
        run: |
          npm ci || npm install
          npm run build
          ls -la dist/app.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/app.css index.html js/app.js package.json README.md dist/app.js
          git status
          git diff --cached --stat
          git commit -m "feat: extract app.css, rename package to chatwithit, wire text file attachments"
