name: Restore index.html

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore full index.html from last good commit + mobile CSS fix
        run: |
          git show 62ea0cc0:index.html > index.html
          python3 << 'PY'
          from pathlib import Path
          src = Path('index.html').read_text()
          old = """@media (max-width: 1100px) {
            .app { grid-template-columns: 1fr; }
            .right-panel { display: none; }
            .sidebar { display: none; position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 100; box-shadow: var(--shadow); }
            .sidebar.open { display: flex; animation: slideIn .22s ease; }
            @keyframes slideIn { from{transform:translateX(-100%)} to{transform:translateX(0)} }
            .msg-col { max-width: min(88%, 620px); }
            .chat-body { padding: 1rem .85rem; }
            .chat-header { padding: .7rem .85rem; }
            #composerWrap { padding: .65rem .85rem; padding-bottom: calc(.65rem + env(safe-area-inset-bottom,0px)); }
          }"""
          new = """@media (max-width: 1100px) {
            .app { grid-template-columns: 1fr; }
            .right-panel { display: none; }
            .sidebar {
              display: none;
              position: fixed;
              top: 0;
              left: 0;
              bottom: 140px;
              height: auto;
              max-height: calc(100dvh - 140px);
              width: var(--sidebar-w);
              z-index: 100;
              box-shadow: var(--shadow);
              overflow-y: auto;
              overflow-x: hidden;
            }
            .sidebar.open { display: flex; animation: slideIn .22s ease; }
            body.sidebar-open #composerWrap { display: none; }
            @keyframes slideIn { from{transform:translateX(-100%)} to{transform:translateX(0)} }
            .msg-col { max-width: min(88%, 620px); }
            .chat-body { padding: 1rem .85rem; }
            .chat-header { padding: .7rem .85rem; }
            #composerWrap { padding: .65rem .85rem; padding-bottom: calc(.65rem + env(safe-area-inset-bottom,0px)); }
          }"""
          # normalize whitespace for match
          if old not in src:
              # try compacted form from good commit
              old2 = """@media (max-width: 1100px) {
            .app { grid-template-columns: 1fr; }
            .right-panel { display: none; }
            .sidebar { display: none; position: fixed; top: 0; left: 0; bottom: 0; width: var(--sidebar-w); z-index: 100; box-shadow: var(--shadow); }
            .sidebar.open { display: flex; animation: slideIn .22s ease; }
            @keyframes slideIn { from{transform:translateX(-100%)} to{transform:translateX(0)} }
            .msg-col { max-width: min(88%, 620px); }
            .chat-body { padding: 1rem .85rem; }
            .chat-header { padding: .7rem .85rem; }
            #composerWrap { padding: .65rem .85rem; padding-bottom: calc(.65rem + env(safe-area-inset-bottom,0px)); }
          }"""
              if old2 not in src:
                  raise SystemExit('CSS block not found in restored index.html')
              src = src.replace(old2, new, 1)
          else:
              src = src.replace(old, new, 1)
          Path('index.html').write_text(src)
          assert 'body.sidebar-open #composerWrap' in src
          assert 'id="composerWrap"' in src
          print('index.html restored OK', len(src), 'bytes')
          PY

      - name: Rebuild dist/app.js
        run: |
          npm ci
          npm run build
          test -f dist/app.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html dist/app.js
          git diff --cached --quiet && echo 'Nothing to commit' && exit 0
          git commit -m "fix: restore full index.html + rebuild dist (model labels, free models, mobile sidebar)"
          git push
